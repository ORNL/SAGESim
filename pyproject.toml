[build-system]
requires = ["setuptools >= 75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sagesim"
version = "0.7.1"
dynamic = ["dependencies"]

requires-python = ">=3.11"
authors = [
  {name = "Xi Zhang", email = "cc.zhang1992@gmail.com"},
  {name = "Chathika Gunaratne", email = "chathikagunaratne@gmail.com"}

]
maintainers = [
  {name = "Xi Zhang", email = "cc.zhang1992@gmail.com"}
]

description = "Scalable Agent-based GPU Enabled Simulator."

readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

keywords = ["agent-based", "hpc", "gpu"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sagesim*"]


[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[project.optional-dependencies]
test = ["pytest>=8.0"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "scaling_tests", "docs", "examples"]
markers = [
    "benchmark: timing benchmark, deselected by default (run with `-m benchmark`)",
    "mpi: exercises more than one rank. NOT deselected: these files also run under a single rank and self-skip their multi-rank cases. Sweep rank counts with tests/run_mpi_tests.sh",
]
addopts = "-m 'not benchmark'"


[project.urls]
Repository = "https://github.com/ornl/sagesim.git"
